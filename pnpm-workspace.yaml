# pnpm 워크스페이스 — `apps/` + `packages/` 표준 모노레포.
#
# `apps/mobile` 은 Flutter(Dart)라 package.json 이 없어 여기에 잡히지 않는다.
# 토큰 생성물만 `packages/design-tokens` 의 `sync:dart` 로 그쪽에 전달한다.
#
# `tools/discord-bridge` 는 포함하지 않는다 — npm(package-lock.json)으로
# 독립 운영 중이고 CI 도 `npm install` 을 쓴다. 묶으면 lock 파일이 충돌하고
# Vercel 배포 경로를 함께 바꿔야 한다. 필요해지면 별도 작업으로 옮긴다.
packages:
  - 'apps/*'
  - 'packages/*'
