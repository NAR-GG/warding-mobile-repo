name: Mixpanel DAU 일일 요약

# 매일 아침 어제 하루의 활성 사용자(DAU)를 Mixpanel 에서 읽어 Discord 로 보낸다.
#
# 왜 Export API 인가: 무료 플랜에서 **조회(Query) API 가 전부 막혀 있다.**
# 실측(2026-10-07)으로 `query/insights`·`query/segmentation`·`query/events/names`
# 가 모두 HTTP 402 "Your plan does not allow API calls" 였다. 반면 원시 이벤트
# Export(`data.mixpanel.com/api/2.0/export`)는 200 이라, 이벤트를 직접 받아
# 고유 사용자 수를 세는 쪽으로 간다. 집계는 우리가 하므로 리포트(bookmark)도
# 필요 없다.
#
# 필요한 Secret:
#   MIXPANEL_SERVICE_ACCOUNT   서비스 계정 사용자명 (Project Settings > Service Accounts)
#   MIXPANEL_SERVICE_SECRET    서비스 계정 비밀번호
#   MIXPANEL_PROJECT_ID        프로젝트 ID
#   DISCORD_DAU_WEBHOOK_URL    보낼 채널 웹훅 (PR 알림과 섞지 않으려고 분리)
#
# Secret 이 하나라도 없으면 조용히 건너뛴다 — 설정 전에 매일 실패 알림이
# 쌓이지 않게 한다.

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC). Mixpanel 수집이 끝난 뒤를 노린다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '조회할 날짜(YYYY-MM-DD). 비우면 어제'
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: DAU 조회 후 Discord 전송
        env:
          MP_USER: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT }}
          MP_SECRET: ${{ secrets.MIXPANEL_SERVICE_SECRET }}
          MP_PROJECT: ${{ secrets.MIXPANEL_PROJECT_ID }}
          WEBHOOK: ${{ secrets.DISCORD_DAU_WEBHOOK_URL }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail

          # 설정이 덜 됐으면 실패가 아니라 건너뛴다.
          for v in MP_USER MP_SECRET MP_PROJECT WEBHOOK; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v 가 비어 있어 DAU 요약을 건너뛴다"
              exit 0
            fi
          done

          TARGET="${INPUT_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          # 수동 실행 입력은 사람이 손으로 넣는 값이라 형식을 먼저 막는다.
          # 엉뚱한 문자열이면 아래 날짜 계산이 깨지거나, Mixpanel 이 400 을 준다.
          if ! printf '%s' "$TARGET" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::날짜 형식이 올바르지 않다: $TARGET (YYYY-MM-DD)"
            exit 1
          fi
          PREV=$(date -u -d "$TARGET -1 day" +%Y-%m-%d)
          echo "조회 날짜: $TARGET (전일 $PREV)"

          # 하루치 원시 이벤트를 받는다. 응답은 JSONL(한 줄에 이벤트 하나).
          #
          # 타임아웃을 거는 이유: Mixpanel 이 응답 없이 매달리면 curl 이
          # 돌아올 때까지 실패 알림조차 안 나간다. 잡 기본 제한이 360분이라
          # 그만큼 조용히 멈춰 있을 수 있다.
          fetch_day() {
            local day="$1" out="$2"
            curl -sS -o "$out" -w '%{http_code}' -G \
              --connect-timeout 15 --max-time 120 \
              -u "$MP_USER:$MP_SECRET" \
              --data-urlencode "project_id=$MP_PROJECT" \
              --data-urlencode "from_date=$day" \
              --data-urlencode "to_date=$day" \
              "https://data.mixpanel.com/api/2.0/export" || echo "000"
          }

          HTTP=$(fetch_day "$TARGET" /tmp/mp.jsonl)
          if [ "$HTTP" != "200" ]; then
            echo "Mixpanel 조회 실패 (HTTP $HTTP)"
            head -c 500 /tmp/mp.jsonl || true
            # 상태코드마다 할 일이 다르다. 뭉뚱그려 "계정을 확인하라" 고 쓰면
            # 402(플랜 제약)인데 Secret 을 들여다보게 만든다.
            case "$HTTP" in
              402) HINT="현재 Mixpanel 플랜에서 이 API 가 막혀 있다 — Secret 문제가 아니다." ;;
              401|403) HINT="인증이 거부됐다. 서비스 계정 사용자명·시크릿과 프로젝트 권한(Analyst 이상)을 확인한다." ;;
              400) HINT="요청이 거부됐다. project_id 와 날짜 형식을 확인한다." ;;
              429) HINT="요청 한도를 넘었다(시간당 60회). 잠시 뒤 다시 시도한다." ;;
              000) HINT="응답을 받지 못했다(타임아웃·네트워크). 잠시 뒤 다시 시도한다." ;;
              *) HINT="서비스 계정과 Mixpanel 상태를 확인한다." ;;
            esac
            jq -n --arg t "⚠️ DAU 요약 실패 (HTTP $HTTP)" --arg d "$HINT" \
                  '{embeds:[{title:$t,description:$d,color:15158332}]}' \
              | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
            exit 1
          fi

          # DAU = 그날 이벤트를 보낸 고유 distinct_id 수.
          #
          # 빈 응답(그날 이벤트 0건)도 200 이라 그대로 0 이 나온다 — 이건
          # 오류가 아니라 사실이므로 그대로 보고한다. Insights 로 하던 때와
          # 달리 "리포트 기간이 안 덮어서 0" 인 경우가 없어 구분이 필요 없다.
          count_uniques() {
            jq -rs 'map(.properties.distinct_id // empty) | unique | length' "$1" 2>/dev/null || echo 0
          }
          DAU=$(count_uniques /tmp/mp.jsonl)
          EVENTS=$(grep -c . /tmp/mp.jsonl 2>/dev/null || echo 0)

          # 전일은 증감 표시에만 쓴다. 실패해도 전체를 죽이지 않는다 —
          # 오늘 숫자는 이미 손에 있는데 어제 때문에 알림을 통째로 거르면
          # 아깝다.
          PREV_HTTP=$(fetch_day "$PREV" /tmp/mp_prev.jsonl)
          if [ "$PREV_HTTP" = "200" ]; then
            DAU_PREV=$(count_uniques /tmp/mp_prev.jsonl)
          else
            echo "전일 조회 실패(HTTP $PREV_HTTP) — 증감 생략"
            DAU_PREV=""
          fi

          echo "DAU=$DAU (이벤트 $EVENTS건) PREV=${DAU_PREV:-조회실패}"

          # 증감률. 전날이 0이거나 못 받았으면 비율이 의미 없다.
          if [ -n "$DAU_PREV" ] && [ "$DAU_PREV" -gt 0 ] 2>/dev/null; then
            DELTA=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{printf "%+.1f%%", (a-b)/b*100}')
            TREND=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{print (a>=b) ? "▲" : "▼"}')
            DELTA_TEXT="$TREND $DELTA (전일 $DAU_PREV)"
          elif [ -n "$DAU_PREV" ]; then
            DELTA_TEXT="전일 0"
          else
            DELTA_TEXT="전일 조회 실패"
          fi

          # 표본이 작으면 증감률이 쉽게 출렁인다(3→5명이 +66.7%). 숫자를
          # 오해하지 않도록 꼬리말을 붙인다. Mixpanel 은 1.0.32+71 부터
          # 들어가서, 그 이전 버전 사용자는 애초에 집계되지 않는다.
          if [ "$DAU" -lt 30 ] 2>/dev/null; then
            FOOTER="표본이 작아 증감률이 크게 흔들린다 · 1.0.32+71 이상만 집계"
          else
            FOOTER="1.0.32+71 이상만 집계"
          fi

          jq -n \
            --arg t "📊 DAU $TARGET" \
            --arg dau "$DAU" \
            --arg delta "$DELTA_TEXT" \
            --arg ev "$EVENTS" \
            --arg f "$FOOTER" \
            '{embeds:[{
               title: $t,
               color: 3447003,
               fields: [
                 {name: "활성 사용자", value: $dau, inline: true},
                 {name: "전일 대비", value: $delta, inline: true},
                 {name: "이벤트 수", value: $ev, inline: true}
               ],
               footer: {text: $f}
             }]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
