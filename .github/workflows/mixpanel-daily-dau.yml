name: Mixpanel DAU 일일 요약

# 매일 아침 어제 하루의 사용 지표를 Mixpanel 에서 읽어 Discord 로 보낸다.
# DAU·재방문 구성, 화면 TOP 5, 로그인·온보딩 퍼널, 참여, 이탈 신호를 담는다.
#
# 집계·렌더링은 같은 폴더의 `mixpanel-dau-summary.jq`(원시 → 지표)와
# `mixpanel-dau-embed.jq`(지표 → Discord embed) 가 맡는다. 지표를 바꾸려면
# 그 두 파일을 고치면 되고, 아래 셸은 조회·오류 처리만 담당한다.
#
# 왜 Export API 인가: 무료 플랜에서 **조회(Query) API 가 전부 막혀 있다.**
# 실측(2026-10-07)으로 `query/insights`·`query/segmentation`·`query/events/names`
# 가 모두 HTTP 402 "Your plan does not allow API calls" 였다. 반면 원시 이벤트
# Export(`data.mixpanel.com/api/2.0/export`)는 200 이라, 이벤트를 직접 받아
# 고유 사용자 수를 세는 쪽으로 간다. 집계는 우리가 하므로 리포트(bookmark)도
# 필요 없다.
#
# 필요한 Secret:
#   MIXPANEL_SERVICE_ACCOUNT   서비스 계정 사용자명 (Project Settings > Service Accounts)
#   MIXPANEL_SERVICE_SECRET    서비스 계정 비밀번호
#   MIXPANEL_PROJECT_ID        프로젝트 ID
#   DISCORD_DAU_WEBHOOK_URL    보낼 채널 웹훅 (PR 알림과 섞지 않으려고 분리)
#
# Secret 이 하나라도 없으면 조용히 건너뛴다 — 설정 전에 매일 실패 알림이
# 쌓이지 않게 한다.

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC). Mixpanel 수집이 끝난 뒤를 노린다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '조회할 날짜(YYYY-MM-DD). 비우면 어제'
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # 집계·렌더링 jq 스크립트를 레포에서 읽어 쓴다.
      - uses: actions/checkout@v4

      - name: DAU 조회 후 Discord 전송
        env:
          MP_USER: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT }}
          MP_SECRET: ${{ secrets.MIXPANEL_SERVICE_SECRET }}
          MP_PROJECT: ${{ secrets.MIXPANEL_PROJECT_ID }}
          WEBHOOK: ${{ secrets.DISCORD_DAU_WEBHOOK_URL }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail

          # 설정이 덜 됐으면 실패가 아니라 건너뛴다.
          for v in MP_USER MP_SECRET MP_PROJECT WEBHOOK; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v 가 비어 있어 DAU 요약을 건너뛴다"
              exit 0
            fi
          done

          TARGET="${INPUT_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          # 수동 실행 입력은 사람이 손으로 넣는 값이라 형식을 먼저 막는다.
          # 엉뚱한 문자열이면 아래 날짜 계산이 깨지거나, Mixpanel 이 400 을 준다.
          if ! printf '%s' "$TARGET" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::날짜 형식이 올바르지 않다: $TARGET (YYYY-MM-DD)"
            exit 1
          fi
          PREV=$(date -u -d "$TARGET -1 day" +%Y-%m-%d)
          echo "조회 날짜: $TARGET (전일 $PREV)"

          # 하루치 원시 이벤트를 받는다. 응답은 JSONL(한 줄에 이벤트 하나).
          #
          # 타임아웃을 거는 이유: Mixpanel 이 응답 없이 매달리면 curl 이
          # 돌아올 때까지 실패 알림조차 안 나간다. 잡 기본 제한이 360분이라
          # 그만큼 조용히 멈춰 있을 수 있다.
          fetch_day() {
            local day="$1" out="$2"
            curl -sS -o "$out" -w '%{http_code}' -G \
              --connect-timeout 15 --max-time 120 \
              -u "$MP_USER:$MP_SECRET" \
              --data-urlencode "project_id=$MP_PROJECT" \
              --data-urlencode "from_date=$day" \
              --data-urlencode "to_date=$day" \
              "https://data.mixpanel.com/api/2.0/export" || echo "000"
          }

          HTTP=$(fetch_day "$TARGET" /tmp/mp.jsonl)
          if [ "$HTTP" != "200" ]; then
            echo "Mixpanel 조회 실패 (HTTP $HTTP)"
            head -c 500 /tmp/mp.jsonl || true
            # 상태코드마다 할 일이 다르다. 뭉뚱그려 "계정을 확인하라" 고 쓰면
            # 402(플랜 제약)인데 Secret 을 들여다보게 만든다.
            case "$HTTP" in
              402) HINT="현재 Mixpanel 플랜에서 이 API 가 막혀 있다 — Secret 문제가 아니다." ;;
              401|403) HINT="인증이 거부됐다. 서비스 계정 사용자명·시크릿과 프로젝트 권한(Analyst 이상)을 확인한다." ;;
              400) HINT="요청이 거부됐다. project_id 와 날짜 형식을 확인한다." ;;
              429) HINT="요청 한도를 넘었다(시간당 60회). 잠시 뒤 다시 시도한다." ;;
              000) HINT="응답을 받지 못했다(타임아웃·네트워크). 잠시 뒤 다시 시도한다." ;;
              *) HINT="서비스 계정과 Mixpanel 상태를 확인한다." ;;
            esac
            jq -n --arg t "⚠️ DAU 요약 실패 (HTTP $HTTP)" --arg d "$HINT" \
                  '{embeds:[{title:$t,description:$d,color:15158332}]}' \
              | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
            exit 1
          fi

          # 받아 둔 원시 이벤트를 요약 지표로 접는다.
          #
          # 이 export 한 번에 `page_view` 의 `location_page`, 클릭 이벤트의
          # 식별자, 퍼널 단계까지 전부 들어 있다. 추가 API 호출 없이 같은
          # 파일을 다시 읽으므로 레이트 리밋(시간당 60회)을 더 쓰지 않는다.
          #
          # 빈 응답(그날 이벤트 0건)도 200 이라 모든 수치가 0 으로 나온다 —
          # 이건 오류가 아니라 사실이므로 그대로 보고한다. Insights 로 하던
          # 때와 달리 "리포트 기간이 안 덮어서 0" 인 경우가 없다.
          # 실패를 삼키지 않는다. 옛 코드는 `2>/dev/null || echo 0` 으로 0 을
          # 내보냈는데, 그 관용구를 집계 전체에 그대로 쓰면 jq 스크립트를
          # 잘못 고친 날 **"DAU 0, 퍼널 전부 0" 이 정상 알림처럼** 나간다.
          # 지표가 늘어난 만큼 조용한 0 이 더 위험해서, 여기서는 멈추고
          # 아래 실패 경로가 Discord 로 알리게 한다.
          summarize() {
            if ! jq -sf .github/workflows/mixpanel-dau-summary.jq "$1" > "$2"; then
              echo "::error::집계 실패 — mixpanel-dau-summary.jq 를 확인한다 ($1)"
              jq -n --arg t "⚠️ DAU 요약 실패 (집계 오류)" \
                    --arg d "원시 이벤트는 받았지만 집계 단계에서 깨졌다. mixpanel-dau-summary.jq 를 확인한다." \
                    '{embeds:[{title:$t,description:$d,color:15158332}]}' \
                | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
              exit 1
            fi
          }
          summarize /tmp/mp.jsonl /tmp/cur.json
          DAU=$(jq -r '.dau' /tmp/cur.json)
          EVENTS=$(jq -r '.events_total' /tmp/cur.json)

          # 전일은 증감·신규 판별에만 쓴다. 실패해도 전체를 죽이지 않는다 —
          # 오늘 숫자는 이미 손에 있는데 어제 때문에 알림을 통째로 거르면
          # 아깝다.
          PREV_HTTP=$(fetch_day "$PREV" /tmp/mp_prev.jsonl)
          if [ "$PREV_HTTP" = "200" ]; then
            # 전일 집계만 깨진 경우는 오늘 알림을 죽이지 않는다 — 조회 실패와
            # 같은 취급으로 증감·구성만 비운다(그래서 summarize 를 안 쓴다).
            if jq -sf .github/workflows/mixpanel-dau-summary.jq /tmp/mp_prev.jsonl > /tmp/prev.json; then
              DAU_PREV=$(jq -r '.dau' /tmp/prev.json)
            else
              echo "::warning::전일 집계 실패 — 증감·구성 생략"
              DAU_PREV=""
            fi
          else
            echo "전일 조회 실패(HTTP $PREV_HTTP) — 증감·신규 생략"
            DAU_PREV=""
          fi

          echo "DAU=$DAU (이벤트 $EVENTS건) PREV=${DAU_PREV:-조회실패}"

          # 증감률. 전날이 0이거나 못 받았으면 비율이 의미 없다.
          if [ -n "$DAU_PREV" ] && [ "$DAU_PREV" -gt 0 ] 2>/dev/null; then
            DELTA=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{printf "%+.1f%%", (a-b)/b*100}')
            TREND=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{print (a>=b) ? "▲" : "▼"}')
            DELTA_TEXT="$TREND $DELTA (전일 $DAU_PREV)"
          elif [ -n "$DAU_PREV" ]; then
            DELTA_TEXT="전일 0"
          else
            DELTA_TEXT="전일 조회 실패"
          fi

          # 재방문 / 그 외.
          #
          # "그 외" 를 신규 설치라고 부르지 않는 이유: 손에 있는 건 이틀치뿐이라
          # 어제 안 보인 사용자가 첫 설치인지 그제 이후 돌아온 복귀 사용자인지
          # 구분할 수 없다. 실제보다 신규가 많아 보이는 오해를 막으려고 이름을
          # 사실에 맞춘다. 진짜 신규는 `$ae_first_open` 이 필요하고, 그건 날짜
          # 범위를 더 넓게 받아야 한다.
          if [ -n "$DAU_PREV" ]; then
            MIX=$(jq -n --slurpfile c /tmp/cur.json --slurpfile p /tmp/prev.json \
              '($c[0].users) as $cu | ($p[0].users) as $pu
               | {ret: (($cu - ($cu - $pu)) | length), oth: (($cu - $pu) | length)}')
            RET=$(printf '%s' "$MIX" | jq -r '.ret')
            OTH=$(printf '%s' "$MIX" | jq -r '.oth')
            MIX_TEXT="재방문 $RET / 그 외 $OTH"
          else
            MIX_TEXT="전일 조회 실패"
          fi

          # 사용자당 이벤트 수. 원시 "이벤트 수" 는 DAU 없이는 해석이 안 된다
          # (318건이 많은지 적은지는 몇 명이 만들었냐에 달렸다).
          if [ "$DAU" -gt 0 ] 2>/dev/null; then
            PER_USER=$(awk -v e="$EVENTS" -v d="$DAU" 'BEGIN{printf "%.1f", e/d}')
            MIX_TEXT="$MIX_TEXT"$'\n'"사용자당 ${PER_USER}건"
          fi

          # 표본이 작으면 증감률과 퍼널 전환율이 쉽게 출렁인다(3→5명이
          # +66.7%, 퍼널은 한 명이 50%p 를 움직인다). 숫자를 오해하지 않도록
          # 꼬리말을 붙인다.
          FOOTER=""
          if [ "$DAU" -lt 30 ] 2>/dev/null; then
            FOOTER="표본이 작아 증감률·전환율이 크게 흔들린다"
          fi

          # 집계 범위는 **데이터로** 말한다.
          #
          # 옛 꼬리말은 "1.0.32+71 이상만 집계" 를 하드코딩했는데, 그건 측정값이
          # 아니라 추측이었다. 실제로 2026-10-21 자 알림이 그 문구를 달고
          # 나갔지만 `app_version` 이 어떤 릴리즈에도 안 들어간 상태여서
          # 1049명 전원이 "버전 미상" 이었다 — 문구가 거짓을 말한 셈이다.
          #
          # 버전 상세는 "앱 버전" 필드가 말하므로 꼬리말에 중복하지 않는다.
          # 다만 전원이 버전 미상이면 **다른 지표의 해석도 달라지므로**
          # (구버전은 우리 이벤트를 아예 안 보낸다) 한 줄 남긴다.
          VER_N=$(jq -r '.versions | length' /tmp/cur.json)
          if [ "$VER_N" = "0" ]; then
            FOOTER="${FOOTER:+$FOOTER · }계측 미도달 구버전이 섞여 있을 수 있다"
          fi

          jq -n --slurpfile c /tmp/cur.json \
            --arg date "$TARGET" \
            --arg delta "$DELTA_TEXT" \
            --arg mix "$MIX_TEXT" \
            --arg f "$FOOTER" \
            '{date: $date, cur: $c[0], pages_top: ($c[0].pages[0:5]),
              exit_top: ($c[0].exit_pages[0:5]),
              versions_top: ($c[0].versions[0:4]),
              delta_text: $delta, mix_text: $mix, footer: $f}' \
            | jq -f .github/workflows/mixpanel-dau-embed.jq \
            | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
