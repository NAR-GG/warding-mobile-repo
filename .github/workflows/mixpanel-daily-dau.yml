name: Mixpanel DAU 일일 요약

# 매일 아침 어제 하루의 활성 사용자(DAU)를 Mixpanel 에서 읽어 Discord 로 보낸다.
#
# 왜 Insights Query API 인가: Segmentation Query API 는 Mixpanel 이 유지보수
# 모드로 돌려 신규 사용을 권장하지 않는다. 대신 Insights 리포트를 대시보드에서
# 만들어 두고 그 bookmark_id 로 조회한다 — 쿼리 정의가 코드가 아니라 대시보드에
# 있어서, 보고 싶은 지표가 바뀌면 워크플로우를 안 고치고 리포트만 고치면 된다.
#
# 필요한 Secret:
#   MIXPANEL_SERVICE_ACCOUNT   서비스 계정 사용자명 (Project Settings > Service Accounts)
#   MIXPANEL_SERVICE_SECRET    서비스 계정 비밀번호
#   MIXPANEL_PROJECT_ID        프로젝트 ID (Project Settings > Overview)
#   MIXPANEL_DAU_BOOKMARK_ID   DAU Insights 리포트의 bookmark_id
#                              (리포트 URL 의 `report-<ID>` 부분)
#   DISCORD_DAU_WEBHOOK_URL    보낼 채널 웹훅 (PR 알림과 섞지 않으려고 분리)
#
# Secret 이 하나라도 없으면 조용히 건너뛴다 — 설정 전에 매일 실패 알림이
# 쌓이지 않게 한다.

on:
  schedule:
    # 매일 09:00 KST (00:00 UTC). Mixpanel 집계가 끝난 뒤를 노린다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '조회할 날짜(YYYY-MM-DD). 비우면 어제'
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: DAU 조회 후 Discord 전송
        env:
          MP_USER: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT }}
          MP_SECRET: ${{ secrets.MIXPANEL_SERVICE_SECRET }}
          MP_PROJECT: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MP_BOOKMARK: ${{ secrets.MIXPANEL_DAU_BOOKMARK_ID }}
          WEBHOOK: ${{ secrets.DISCORD_DAU_WEBHOOK_URL }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail

          # 설정이 덜 됐으면 실패가 아니라 건너뛴다.
          for v in MP_USER MP_SECRET MP_PROJECT MP_BOOKMARK WEBHOOK; do
            if [ -z "${!v}" ]; then
              echo "::notice::$v 가 비어 있어 DAU 요약을 건너뛴다"
              exit 0
            fi
          done

          TARGET="${INPUT_DATE:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          # 수동 실행 입력은 사람이 손으로 넣는 값이라 형식을 먼저 막는다.
          # 엉뚱한 문자열이면 아래 날짜 계산이 깨지거나, 어느 키와도 안 맞아
          # 조용히 0 이 나간다.
          if ! printf '%s' "$TARGET" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::날짜 형식이 올바르지 않다: $TARGET (YYYY-MM-DD)"
            exit 1
          fi
          echo "조회 날짜: $TARGET"

          # Insights 리포트 조회. 실패해도 워크플로우를 죽이지 않고 아래에서
          # 알림으로 알린다 — 조용히 실패하면 지표가 끊긴 걸 아무도 모른다.
          #
          # 타임아웃을 거는 이유: Mixpanel 이 응답 없이 매달리면 curl 이
          # 돌아올 때까지 실패 알림조차 안 나간다. 잡 기본 제한이 360분이라
          # 그만큼 조용히 멈춰 있을 수 있다. 끊어서 아래 HTTP != 200 경로로
          # 보낸다(--max-time 은 연결 후 전체 소요까지 포함).
          HTTP=$(curl -sS -o /tmp/mp.json -w '%{http_code}' -G \
            --connect-timeout 15 --max-time 60 \
            -u "$MP_USER:$MP_SECRET" \
            --data-urlencode "project_id=$MP_PROJECT" \
            --data-urlencode "bookmark_id=$MP_BOOKMARK" \
            "https://mixpanel.com/api/query/insights" || echo "000")

          if [ "$HTTP" != "200" ]; then
            echo "Mixpanel 조회 실패 (HTTP $HTTP)"
            head -c 500 /tmp/mp.json || true
            jq -n --arg t "⚠️ DAU 요약 실패" \
                  --arg d "Mixpanel 조회가 HTTP $HTTP 로 실패했다. 서비스 계정·bookmark_id 를 확인한다." \
                  '{embeds:[{title:$t,description:$d,color:15158332}]}' \
              | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
            exit 1
          fi

          # 리포트가 조회 날짜를 **포함하는지** 먼저 본다.
          #
          # 아래 합산은 키가 하나도 안 맞으면 `// 0` 으로 0 을 돌려준다. 그런데
          # 리포트 기간이 TARGET 을 안 덮으면(대시보드에서 기간을 "최근 7일"
          # 같은 걸로 바꿔 놨거나, 집계가 아직 안 끝났거나) 그 0 이 그대로
          # "DAU 0명" 으로 나간다 — **진짜 0 과 구분이 안 되고, 사용자가 전부
          # 끊긴 것처럼 보인다.** 조용한 오보보다 실패가 낫다.
          FROM=$(jq -r '.date_range.from_date // empty' /tmp/mp.json | cut -c1-10)
          TO=$(jq -r '.date_range.to_date // empty' /tmp/mp.json | cut -c1-10)
          if [ -z "$FROM" ] || [ -z "$TO" ] || \
             [ "$TARGET" \< "$FROM" ] || [ "$TARGET" \> "$TO" ]; then
            echo "리포트 기간($FROM ~ $TO)이 조회 날짜($TARGET)를 덮지 않는다"
            jq -n --arg t "⚠️ DAU 요약 건너뜀" \
                  --arg d "리포트 기간(\`${FROM:-?} ~ ${TO:-?}\`)이 조회 날짜 \`$TARGET\` 을 포함하지 않아 집계를 중단했다. Insights 리포트의 기간 설정을 확인한다." \
                  '{embeds:[{title:$t,description:$d,color:16426522}]}' \
              | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
            exit 1
          fi

          # series 는 {계열명: {ISO날짜: 값}} 구조다. 계열이 하나라고 가정하지
          # 않고 전부 합산한다 — 리포트에서 분기(breakdown)를 걸어도 총합은 맞다.
          #
          # 어제 값과 그 전날 값을 각각 뽑아 증감을 만든다. 날짜 키는 ISO 라
          # 접두사(YYYY-MM-DD)로 맞춘다.
          PREV=$(date -u -d "$TARGET -1 day" +%Y-%m-%d)

          DAU=$(jq -r --arg d "$TARGET" '
            def sum_for($day):
              [ .series[]? | to_entries[]? | select(.key | startswith($day)) | .value ]
              | map(select(type == "number")) | add // 0;
            sum_for($d)
          ' /tmp/mp.json)
          DAU_PREV=$(jq -r --arg p "$PREV" '
            def sum_for($day):
              [ .series[]? | to_entries[]? | select(.key | startswith($day)) | .value ]
              | map(select(type == "number")) | add // 0;
            sum_for($p)
          ' /tmp/mp.json)

          echo "DAU=$DAU PREV=$DAU_PREV"

          # 증감률. 전날이 0이면 비율이 의미 없으므로 생략한다.
          if [ "${DAU_PREV%.*}" -gt 0 ] 2>/dev/null; then
            DELTA=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{printf "%+.1f%%", (a-b)/b*100}')
            TREND=$(awk -v a="$DAU" -v b="$DAU_PREV" 'BEGIN{print (a>=b) ? "▲" : "▼"}')
            DELTA_TEXT="$TREND $DELTA (전일 $DAU_PREV)"
          else
            DELTA_TEXT="전일 데이터 없음"
          fi

          jq -n \
            --arg t "📊 DAU $TARGET" \
            --arg dau "$DAU" \
            --arg delta "$DELTA_TEXT" \
            '{embeds:[{
               title: $t,
               color: 3447003,
               fields: [
                 {name: "활성 사용자", value: $dau, inline: true},
                 {name: "전일 대비", value: $delta, inline: true}
               ]
             }]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
