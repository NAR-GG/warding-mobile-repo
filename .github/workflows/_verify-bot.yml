name: 봇 설정 확인 (임시)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 봇 토큰·채널 권한 확인
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          echo "=== 1. 봇 토큰이 유효한가 ==="
          R=$(curl -s -w '\n%{http_code}' https://discord.com/api/v10/users/@me \
            -H "Authorization: Bot $BOT_TOKEN")
          C=$(echo "$R"|tail -1); B=$(echo "$R"|sed '$d')
          if [ "$C" = "200" ]; then
            echo "  ✅ 유효 — 봇: $(echo "$B" | jq -r '.username')"
          else
            echo "  🔴 HTTP $C — 토큰이 잘못됐다"; echo "$B" | head -c 200; exit 1
          fi

          echo "=== 2. 채널에 접근 가능한가 ==="
          R=$(curl -s -w '\n%{http_code}' "https://discord.com/api/v10/channels/$CHANNEL_ID" \
            -H "Authorization: Bot $BOT_TOKEN")
          C=$(echo "$R"|tail -1); B=$(echo "$R"|sed '$d')
          if [ "$C" = "200" ]; then
            echo "  ✅ 접근 가능 — #$(echo "$B" | jq -r '.name')"
          else
            echo "  🔴 HTTP $C — 봇이 서버에 초대되지 않았거나 채널 권한이 없다"
            echo "$B" | head -c 300; exit 1
          fi

          echo "=== 3. 버튼이 달린 메시지를 실제로 보낼 수 있는가 ==="
          jq -n '{embeds:[{title:"🔧 설정 확인용 메시지",description:"이 메시지가 보이고 아래 버튼이 눌리면 설정이 끝난 것이다.\n확인 후 지워도 된다.",color:3447003}],
                  components:[{type:1,components:[{type:2,style:2,label:"테스트 버튼 (눌러보세요)",custom_id:"rel_cancel"}]}]}' > /tmp/m.json
          R=$(curl -s -w '\n%{http_code}' -X POST "https://discord.com/api/v10/channels/$CHANNEL_ID/messages" \
            -H "Authorization: Bot $BOT_TOKEN" -H "Content-Type: application/json" -d @/tmp/m.json)
          C=$(echo "$R"|tail -1)
          if [ "$C" = "200" ]; then
            echo "  ✅ 버튼 메시지 전송 성공 — Discord 채널을 확인하세요"
          else
            echo "  🔴 HTTP $C"; echo "$R"|sed '$d'|head -c 300; exit 1
          fi
