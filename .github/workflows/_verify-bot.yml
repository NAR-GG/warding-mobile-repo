name: 봇 설정 확인 (임시)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 봇이 어느 서버에 들어가 있나
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          echo "=== 봇이 속한 서버 목록 ==="
          curl -s https://discord.com/api/v10/users/@me/guilds \
            -H "Authorization: Bot $BOT_TOKEN" \
            | jq -r '.[] | "  서버: \(.name)  (id=\(.id))"' || echo "  조회 실패"

          echo "=== 각 서버에서 이 채널이 보이나 ==="
          for GID in $(curl -s https://discord.com/api/v10/users/@me/guilds -H "Authorization: Bot $BOT_TOKEN" | jq -r '.[].id'); do
            GNAME=$(curl -s "https://discord.com/api/v10/guilds/$GID" -H "Authorization: Bot $BOT_TOKEN" | jq -r '.name')
            FOUND=$(curl -s "https://discord.com/api/v10/guilds/$GID/channels" -H "Authorization: Bot $BOT_TOKEN" \
              | jq -r --arg c "$CHANNEL_ID" '.[] | select(.id==$c) | .name' 2>/dev/null)
            if [ -n "$FOUND" ]; then
              echo "  ✅ '$GNAME' 서버에 #$FOUND 채널이 있다 (봇이 볼 수 있음)"
            else
              echo "  ⚠️ '$GNAME' 서버에서는 이 채널 ID 를 못 찾았다"
              echo "     그 서버의 텍스트 채널(봇이 보는 것):"
              curl -s "https://discord.com/api/v10/guilds/$GID/channels" -H "Authorization: Bot $BOT_TOKEN" \
                | jq -r '.[] | select(.type==0) | "       #\(.name)  id=\(.id)"' | head -10
            fi
          done
