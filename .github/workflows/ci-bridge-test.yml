name: Discord Bridge Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/discord-bridge/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/discord-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
