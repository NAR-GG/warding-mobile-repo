name: 심사 제출 (수동)

# 이미 TestFlight·Play 내부테스트에 올라간 빌드를 심사/프로덕션에 올린다.
# release-deploy.yml 이 업로드까지 끝낸 뒤, 사람이 TestFlight 에서 확인하고
# 이 워크플로우를 Actions 탭에서 눌러 실행한다.
#
# 릴리즈 파이프라인에 넣지 않고 따로 뺀 이유:
#   1) 심사 제출에는 CI 가 재시도로 넘을 수 없는 블로커가 있다. 같은 앱의 다른
#      빌드가 이미 심사 중이면 Apple 이 제출을 거부한다(fastlane#12551). 이걸
#      릴리즈 파이프라인에 묶으면 빌드·업로드는 멀쩡히 끝났는데 파이프라인
#      전체가 빨간불이 된다.
#   2) 심사 제출은 되돌리기 어려운 일방향 동작이다. 태그를 미는 것과는 다른
#      무게의 결정이라 발동 시점을 사람이 따로 고르는 게 맞다.
#   3) Apple 공식 레퍼런스 워크플로우와 Shorebird 공식 fastlane 가이드가 모두
#      TestFlight 에서 멈춘다. 업계 표준이 "업로드는 자동, 제출은 수동" 이다.
#
# 설계 배경은 intent/release-build-automation/spec.md 참고.

# 발동 경로가 둘이다. 둘 다 같은 잡을 돈다.
#   - workflow_dispatch: Actions 탭에서 사람이 직접 (비상 경로)
#   - workflow_call:     release-submit-dispatch.yml 이 Discord 버튼 요청을 받아
#
# Discord 경로가 이 워크플로우를 'gh workflow run' 으로 부르던 때는 PAT 에
# Actions: write 가 필요했고, 그게 없어서 HTTP 403 으로 제출이 막혔다
# (1.0.34+84). workflow_call 로 바꿔 Actions API 를 아예 타지 않게 한다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '제출할 버전 (pubspec 형식 그대로, 예: 1.0.33+80)'
        required: true
      platform:
        description: '제출할 플랫폼'
        required: true
        default: 'ios'
        type: choice
        options: [ios, android, both]
      android_rollout:
        description: 'Android production 단계적 출시 비율 (1 = 100%, 0.1 = 10%)'
        required: false
        default: '1'
      release_notes:
        description: '패치노트 (비우면 distribution/ 의 내용을 쓴다)'
        required: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      android_rollout:
        required: false
        default: '1'
        type: string
      release_notes:
        required: false
        type: string
    # 호출된 워크플로우는 레포 Secret 을 자동으로 물려받지 않는다. 이름을 적어
    # 넘겨야 한다 (e2e-release-check.yml 과 같은 방식).
    secrets:
      ASC_KEY_P8:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      DISCORD_RELEASE_WEBHOOK_URL:
        required: false
      DISCORD_PR_WEBHOOK_URL:
        required: false

permissions:
  contents: read

concurrency:
  # 같은 앱에 제출을 동시에 두 번 보내지 않는다.
  #
  # 이 설정은 workflow_dispatch 로 직접 실행할 때만 적용된다. workflow_call 로
  # 불렸을 때는 잡이 호출한 쪽의 런 안에서 돌기 때문에 여기 group 이 아니라
  # 호출자의 group(release-submit)이 잠금을 맡는다. 두 경로를 동시에 쓰면
  # group 이 달라 서로를 막지 못하므로, Discord 와 Actions 탭에서 같은 버전을
  # 동시에 제출하지 않는다.
  group: submit-for-review
  cancel-in-progress: false

jobs:
  submit-ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    # 러너 이미지 고정 이유는 release-deploy.yml 의 build-ios 주석 참고.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: App Store 심사 제출
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 입력은 사람이 손으로 넣는 값이라 형식을 먼저 막는다.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::버전 형식이 올바르지 않다: $VERSION (예: 1.0.33+80)"
            exit 1
          fi
          MARKETING_VERSION="${VERSION%%+*}"   # 1.0.33+80 → 1.0.33
          BUILD_NUMBER="${VERSION##*+}"        # 1.0.33+80 → 80

          # ── 제출 전 확인: 지금 줄에 선 버전에 빌드를 바꿔 끼울 수 있는가 ──────
          #
          # 1.0.41 사고를 막는 자리다. 심사 대기(Waiting For Review) 상태인 버전에는
          # ASC 가 빌드 교체를 거부하는데, deliver 는 **버전 문자열과 패치노트를
          # 먼저 바꾼 뒤** 빌드를 붙이려 한다. 그래서 거부당하면 "표시만 새 버전,
          # 바이너리는 옛 빌드" 인 상태가 남고 그대로 심사·출시로 흘러간다.
          #
          # 여기서 멈추면 ASC 는 손대지 않은 상태로 남는다. 사람이 ASC 에서 심사를
          # 취소하거나 끝나기를 기다린 뒤 다시 실행하면 된다.
          STATE_OUT=$(python3 scripts/asc_version_state.py || true)
          echo "$STATE_OUT"
          asc_field() { printf '%s\n' "$STATE_OUT" | grep "^$1=" | head -1 | cut -d= -f2-; }

          if [ "$(asc_field ok)" != "true" ]; then
            # 조회가 막혔다고 제출을 막지는 않는다 — 네트워크·권한 문제로 릴리즈가
            # 멈추는 쪽이 더 나쁘다. 대신 제출 뒤 검증이 같은 이유로 못 돌면
            # 그때는 실패로 처리한다(아래).
            echo "::warning::ASC 상태를 확인하지 못했다. 제출은 진행하되 끝난 뒤 ASC 에서 빌드 번호를 직접 확인하라."
          else
            CUR_VERSION=$(asc_field version)
            CUR_STATE=$(asc_field state)
            CUR_BUILD=$(asc_field build)
            echo "ASC 현재 상태: ${CUR_VERSION:-(없음)} / ${CUR_STATE:-(없음)} / 빌드 ${CUR_BUILD:-(없음)}"

            # 이미 이 버전·이 빌드가 올라가 있으면 진짜 중복 제출이다. 옛 가드가
            # 잡으려던 경우인데, 이제는 로그 문자열이 아니라 ASC 의 사실로 가린다.
            #
            # 중복이 실제로 일어난다. Discord 버튼이 11초 간격으로 두 번 발사된
            # 적이 있고, concurrency 는 cancel-in-progress: false 라 중복을 막지
            # 않고 순서대로 돌릴 뿐이라 뒤엣것이 이 경로를 탄다.
            if [ "$CUR_VERSION" = "$MARKETING_VERSION" ] && [ "$CUR_BUILD" = "$BUILD_NUMBER" ] \
               && [ "$(asc_field editable)" != "true" ]; then
              echo "::warning::$VERSION 은 이미 심사에 올라가 있다($CUR_STATE). 중복 제출이라 건너뛴다."
              exit 0
            fi
            # 다른 버전이 심사 줄을 잡고 있으면 빌드를 못 바꿔 끼운다 → 멈춘다.
            if [ "$(asc_field editable)" != "true" ]; then
              echo "::error::ASC 의 $CUR_VERSION 이 $CUR_STATE 상태라 빌드를 교체할 수 없다."
              echo "::error::이대로 제출하면 버전 표시만 $MARKETING_VERSION 으로 바뀌고 바이너리는 빌드 ${CUR_BUILD:-?} 로 남는다 (1.0.41 사고)."
              echo "::error::ASC 에서 해당 버전의 심사를 취소하거나 끝나기를 기다린 뒤 다시 실행하라."
              exit 1
            fi
          fi

          # API 키는 JSON 파일로 넘긴다. 'fastlane run app_store_connect_api_key' 를
          # 따로 부르고 그다음 deliver 를 부르면 두 프로세스가 달라 인증이 이어지지
          # 않는다 — deliver 가 직접 읽는 --api_key_path 를 쓴다.
          # key 는 .p8 '내용' 을 그대로 넣는다(파일 경로가 아니다).
          P8_CONTENT=$(echo -n "$ASC_KEY_P8" | base64 --decode)
          jq -n --arg kid "$ASC_KEY_ID" --arg iss "$ASC_ISSUER_ID" --arg key "$P8_CONTENT" \
            '{key_id:$kid, issuer_id:$iss, key:$key, in_house:false}' > "$RUNNER_TEMP/asc_key.json"

          gem install --no-document fastlane

          # 업로드 직후 빌드는 'PROCESSING' 상태라 바로 제출할 수 없다. 처리가 끝날
          # 때까지 폴링한다 (최대 45분 — Apple 쪽 처리 시간은 들쭉날쭉하다).
          # app_store_build_number 는 처리가 끝난 빌드만 보이므로, 우리가 올린
          # 빌드 번호가 보일 때까지 기다리는 것으로 'PROCESSING 끝'을 판정한다.
          DEADLINE=$(( $(date +%s) + 45 * 60 ))
          PROCESSED=false
          until [ "$(date +%s)" -ge "$DEADLINE" ]; do
            LATEST=$(fastlane run app_store_build_number \
              api_key_path:"$RUNNER_TEMP/asc_key.json" \
              app_identifier:com.nar.wardingapp \
              version:"$MARKETING_VERSION" \
              live:false 2>/dev/null \
              | grep -oE 'Result: *[0-9]+' | grep -oE '[0-9]+' | tail -1 || true)
            if [ "${LATEST:-0}" -ge "$BUILD_NUMBER" ] 2>/dev/null; then
              echo "빌드 $BUILD_NUMBER 처리 완료"
              PROCESSED=true
              break
            fi
            echo "빌드 처리 대기 중 (ASC 최신: ${LATEST:-없음} / 기다리는 중: $BUILD_NUMBER)"
            sleep 60
          done
          if [ "$PROCESSED" != "true" ]; then
            echo "::error::45분을 기다렸지만 빌드 $BUILD_NUMBER 가 App Store Connect 에서 처리 완료되지 않았다. ASC 에서 상태를 확인하고 다시 실행하라."
            exit 1
          fi

          echo "제출: $MARKETING_VERSION ($BUILD_NUMBER)"
          # 'deliver submit_build' 가 이미 올라간 빌드를 심사에 올리는 공식 경로다.
          # 'deliver submit_for_review' 는 서브커맨드가 아니라 플래그 이름이어서
          # 그렇게 부르면 동작하지 않는다.
          #
          # 릴리스 노트·설명·키워드·지원/마케팅 URL 을 레포의 distribution/metadata
          # 에서 올린다. deliver 는 그 디렉터리에 **있는 파일만** 덮어쓰므로,
          # 스크린샷 등 파일을 두지 않은 항목은 ASC 에 있는 것이 그대로 남는다.
          #
          # 원래는 release_notes.txt 만 뒀는데, ASC 에 새 버전이 생기면 설명·키워드·
          # 지원 URL 이 빈 채로 만들어지고(이전 버전에서 복사되지 않는다) 그대로
          # 심사에 올라가 Apple 이 거부한다 — 1.0.34+84 에서 밟았다. 그래서 그 셋도
          # 파일로 둔다. 대신 ASC 에서 직접 고친 설명·키워드는 다음 제출 때 덮어써진다
          # (distribution/README.md 에 명시해 뒀다).
          #
          # --skip_metadata 를 켜면 릴리스 노트도 같이 막혀서 "새로운 기능" 칸이 빈 채로
          # 심사에 올라간다. 그래서 끄고 metadata_path 를 준다.
          #
          # automatic_release=true 는 심사 승인 즉시 출시한다. false 였을 때는 승인 후
          # ASC 에서 '이 버전 출시' 를 사람이 눌러야 했는데, 1.0.34 에서 그걸 모르고
          # 승인된 채 대기할 뻔했다. Play 쪽은 승격 즉시 나가므로 양 스토어의 출시
          # 시점을 맞추는 쪽이 운영에 맞다.
          #
          # phased_release 는 지정하지 않는다(deliver 기본값 = 끔). iOS 는 단계적 출시
          # 없이 승인 즉시 전체 사용자에게 나간다. Android 의 android_rollout 과는
          # 별개이며, 그 입력은 submit-android 잡에서만 쓴다.
          #
          # 실패를 바로 받지 않는다. deliver 의 종료 코드만으로는 "제출됐는지" 를
          # 알 수 없어서(1.0.41 때 실패한 런이 ASC 를 반쯤 바꿔 놓고 끝났다)
          # 종료 코드와 무관하게 **아래에서 ASC 에 직접 물어 판정한다.**
          set +e
          fastlane deliver submit_build \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_identifier com.nar.wardingapp \
            --app_version "$MARKETING_VERSION" \
            --build_number "$BUILD_NUMBER" \
            --metadata_path distribution/metadata \
            --skip_binary_upload true \
            --skip_metadata false \
            --skip_screenshots true \
            --submit_for_review true \
            --automatic_release true \
            --precheck_include_in_app_purchases false \
            --force true \
            2>&1 | tee /tmp/ios-submit.log
          STATUS=${PIPESTATUS[0]}
          set -e
          rm -f "$RUNNER_TEMP/asc_key.json"

          # ── 제출 후 검증: ASC 에 붙은 빌드가 정말 우리가 올린 빌드인가 ─────────
          #
          # 옛 코드는 deliver 로그에 'is in (Waiting For Review|...)' 가 있으면
          # 중복 제출로 보고 exit 0 했다. 그런데 그 문자열은 두 가지 경우에 똑같이
          # 나온다.
          #   (a) 같은 버전·빌드를 두 번 제출했다            → 넘겨도 되는 상태
          #   (b) 다른 버전이 심사 줄을 잡아 빌드를 못 붙였다 → 1.0.41 사고
          # 로그로는 둘을 구분할 수 없어서 (b) 가 초록불로 끝났다. 이제 로그를 믿지
          # 않고 ASC 에 "그 버전에 붙은 빌드 번호" 를 물어 판정한다.
          VERIFY_OUT=$(python3 scripts/asc_version_state.py || true)
          echo "$VERIFY_OUT"
          v_field() { printf '%s\n' "$VERIFY_OUT" | grep "^$1=" | head -1 | cut -d= -f2-; }

          if [ "$(v_field ok)" != "true" ]; then
            # 제출 전에는 조회 실패를 경고로 넘겼지만, 여기서는 넘길 수 없다.
            # 검증하지 못한 제출을 성공으로 보고하는 것이 이번 사고의 본질이다.
            echo "::error::제출 후 ASC 상태를 확인하지 못해 결과를 보증할 수 없다. ASC 에서 $MARKETING_VERSION 에 붙은 빌드가 $BUILD_NUMBER 인지 직접 확인하라."
            exit 1
          fi

          GOT_VERSION=$(v_field version)
          GOT_BUILD=$(v_field build)
          GOT_STATE=$(v_field state)
          echo "ASC 확인: $GOT_VERSION / $GOT_STATE / 빌드 ${GOT_BUILD:-(없음)}"

          if [ "$GOT_VERSION" != "$MARKETING_VERSION" ]; then
            echo "::error::ASC 의 버전이 $GOT_VERSION 이다 — $MARKETING_VERSION 을 제출했는데 반영되지 않았다."
            exit 1
          fi
          if [ "$GOT_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::$MARKETING_VERSION 에 붙은 빌드가 ${GOT_BUILD:-(없음)} 이다 — 올리려던 빌드는 $BUILD_NUMBER 다."
            echo "::error::1.0.41 사고와 같은 상태다. 이대로 승인되면 버전 표시만 바뀌고 옛 코드가 나간다."
            echo "::error::ASC 에서 심사를 취소하고 빌드를 바로잡은 뒤 다시 제출하라."
            exit 1
          fi

          # 버전·빌드가 맞다. 심사 줄에 들어갔는지까지 본다 — deliver 가 메타데이터만
          # 올리고 제출 단계에서 조용히 멈춘 경우를 여기서 잡는다.
          case "$GOT_STATE" in
            WAITING_FOR_REVIEW|IN_REVIEW|PENDING_DEVELOPER_RELEASE|PENDING_APPLE_RELEASE|PROCESSING_FOR_APP_STORE|READY_FOR_SALE|READY_FOR_DISTRIBUTION)
              echo "심사 제출 완료 — $MARKETING_VERSION (빌드 $BUILD_NUMBER) / $GOT_STATE"
              exit 0
              ;;
          esac
          echo "::error::빌드는 $BUILD_NUMBER 로 맞게 붙었지만 상태가 $GOT_STATE 다 — 심사 줄에 들어가지 않았다."
          echo "::error::deliver 종료 코드: $STATUS. 위 로그를 확인하고 ASC 에서 제출 상태를 보라."
          exit 1

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-submit-log
          path: /tmp/ios-submit.log
          retention-days: 14
          if-no-files-found: ignore

  submit-android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 'gem install fastlane' 을 그냥 부르면 시스템 gem 디렉터리에 쓰려다 막힌다.
      #
      #   Gem::FilePermissionError
      #   You don't have write permissions for the /var/lib/gems/3.2.0 directory.
      #
      # ubuntu-latest 가 24.04 로 넘어가면서 시스템 Ruby 에 sudo 없이 설치가
      # 안 되게 바뀌었다. 1.0.34+84 제출에서 실제로 밟았다. sudo 를 붙이는 대신
      # setup-ruby 로 사용자 소유 gem 경로를 쓴다 — 러너 이미지의 Ruby 가 또
      # 바뀌어도 여기 고정한 버전으로 돈다.
      #
      # bundler-cache 는 쓰지 않는다. Gemfile 이 있어야 동작하는데 이 레포는
      # fastlane 을 gem install 로만 쓴다(워크플로우 두 곳뿐이라 Gemfile 을
      # 두는 쪽이 과하다).
      #
      # submit-ios 에는 이 문제가 없다(brew Ruby 라 사용자 권한으로 깔린다).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Play production 단계적 출시
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ inputs.version }}
          ROLLOUT: ${{ inputs.android_rollout }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::버전 형식이 올바르지 않다: $VERSION (예: 1.0.33+80)"
            exit 1
          fi
          # rollout 은 0 초과 1 이하여야 한다. 범위를 벗어나면 supply 가 거부한다.
          if ! awk -v r="$ROLLOUT" 'BEGIN{exit !(r>0 && r<=1)}'; then
            echo "::error::rollout 은 0 초과 1 이하여야 한다: $ROLLOUT"
            exit 1
          fi
          BUILD_NUMBER="${VERSION##*+}"

          echo -n "$PLAY_JSON" > "$RUNNER_TEMP/play.json"

          # 패치노트가 넘어왔으면 distribution/ 에 반영해 승격 때 같이 올린다.
          # 안 그러면 내부테스트 업로드 시점(태그 push)에 있던 옛 노트가 그대로
          # production 에 따라간다 — AI 가 쓴 내용이 반영될 경로가 없어진다.
          SKIP_META=true
          if [ -n "${NOTES:-}" ]; then
            LEN=$(printf '%s' "$NOTES" | wc -m | tr -d ' ')
            if [ "$LEN" -gt 500 ]; then
              echo "::error::패치노트가 ${LEN}자로 Play 제한(500자)을 넘는다."
              exit 1
            fi
            printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-ko-KR
            SKIP_META=false
            echo "패치노트를 production 에 함께 올린다 (${LEN}자)"
          fi

          gem install --no-document fastlane

          # 내부테스트에 올라간 빌드를 production 으로 승격한다.
          #
          # rollout 이 0 과 1 사이면 supply 가 릴리즈 상태를 inProgress 로 덮어쓰므로
          # track_promote_release_status 를 같이 주지 않는다 (같이 줘도 무시된다).
          # version_code 는 반드시 준다 — 내부테스트 트랙에 릴리즈가 2개 이상이면
          # "use :version_code to filter the release to promote" 로 실패한다.
          #
          # 패치노트가 안 넘어오면 skip_upload_metadata 가 true 다. 그때는 내부테스트에
          # 올라간 릴리즈의 노트가 그대로 따라간다. 넘어오면 false 로 바꿔 새 내용을
          # 올린다 — Discord 에서 AI 초안을 고쳐 제출한 경우가 그렇다.
          echo "승격: build $BUILD_NUMBER → production ${ROLLOUT}"
          fastlane run upload_to_play_store \
            package_name:com.warding.app \
            json_key:"$RUNNER_TEMP/play.json" \
            track:internal \
            track_promote_to:production \
            rollout:"$ROLLOUT" \
            version_code:"$BUILD_NUMBER" \
            skip_upload_aab:true \
            skip_upload_metadata:"$SKIP_META" \
            metadata_path:distribution/whatsnew \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            2>&1 | tee /tmp/android-submit.log
          rm -f "$RUNNER_TEMP/play.json"

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-submit-log
          path: /tmp/android-submit.log
          retention-days: 14
          if-no-files-found: ignore

  notify:
    needs: [submit-ios, submit-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림
        env:
          # 릴리즈 전용 채널 (없으면 기존 PR 채널로 폴백).
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL || secrets.DISCORD_PR_WEBHOOK_URL }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ inputs.platform }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_IOS: ${{ needs.submit-ios.result }}
          R_ANDROID: ${{ needs.submit-android.result }}
        run: |
          set -euo pipefail
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "🔴" ;;
              cancelled) echo "⚪" ;;
              skipped) echo "⏭️" ;;
              *) echo "❔" ;;
            esac
          }
          # 건너뛴 플랫폼(skipped)은 실패가 아니다 — 한쪽만 제출하는 게 정상 사용이다.
          if [ "$R_IOS" = "failure" ] || [ "$R_ANDROID" = "failure" ]; then
            TITLE="🔴 심사 제출 실패 — $VERSION"
            COLOR=15158332
          elif [ "$R_IOS" = "cancelled" ] || [ "$R_ANDROID" = "cancelled" ]; then
            TITLE="⚪ 심사 제출 취소됨 — $VERSION"
            COLOR=9807270
          else
            TITLE="📮 심사 제출 완료 — $VERSION"
            COLOR=3066993
          fi
          DESC=$(printf '%s iOS · %s Android (%s)\n\n[실행 로그](%s)' \
            "$(icon "$R_IOS")" "$(icon "$R_ANDROID")" "$PLATFORM" "$RUN_URL")
          jq -n --arg t "$TITLE" --arg d "$DESC" --argjson c "$COLOR" \
            '{embeds:[{title:$t,description:$d,color:$c}]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
