name: 심사 제출 (Discord 버튼)

# Discord 릴리즈 알림의 [심사 제출] 버튼이 2단계 확인을 거쳐 보내는 요청을 받는다.
# tools/discord-bridge 가 repository_dispatch(release-submit)로 쏜다.
#
# 하는 일은 두 가지다.
#   1) 패치노트 초안이 함께 왔으면 distribution/ 에 반영하고 main 에 커밋한다.
#   2) submit-for-review.yml 을 호출한다.
#
# 실제 제출 로직을 여기에 복사하지 않고 기존 워크플로우를 쓰는 이유: Actions 탭에서
# 직접 실행하는 경로가 계속 살아 있어야 한다. Discord 나 Vercel 이 죽어도 릴리즈가
# 막히면 안 된다.
#
# 부르는 방식은 'gh workflow run'(Actions API) 이 아니라 workflow_call 이다.
# API 를 타려면 DISPATCH_TOKEN 에 Actions: write 가 있어야 하는데 그게 없어서
# 1.0.34+84 제출이 HTTP 403 으로 막혔다. workflow_call 은 같은 런 안에서 잡을
# 띄우므로 토큰이 필요 없다. 워크플로우 파일의 permissions 선언은 GITHUB_TOKEN
# 에만 적용되고, PAT 을 명시적으로 넘기면 PAT 자신의 스코프가 적용된다 —
# 'actions: write' 가 여기 적혀 있어도 PAT 에 없으면 소용이 없었다.
#
# 설계 배경은 intent/discord-release-approval/spec.md 참고.

on:
  repository_dispatch:
    types: [release-submit]

# actions: write 를 뺐다. workflow_call 로 바꿔 Actions API 를 더 이상 치지 않는다.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # 같은 앱에 제출을 동시에 두 번 보내지 않는다.
  group: release-submit
  cancel-in-progress: false

jobs:
  # 검증과 패치노트 반영. 제출 자체는 아래 submit 잡이 맡는다.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DISPATCH_TOKEN }}

      - name: 입력 검증
        id: check
        env:
          VERSION: ${{ github.event.client_payload.version }}
          PLATFORM: ${{ github.event.client_payload.platform }}
        run: |
          set -euo pipefail
          # bridge 가 이미 걸렀지만, repository_dispatch 는 토큰만 있으면 누구나 쏠 수
          # 있는 경로라 여기서도 막는다.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::버전 형식이 올바르지 않다: $VERSION"
            exit 1
          fi
          case "$PLATFORM" in
            ios|android|both) ;;
            *) echo "::error::platform 이 올바르지 않다: $PLATFORM"; exit 1 ;;
          esac
          # 태그가 실제로 있는 버전인지 확인한다. 빌드된 적 없는 버전을 심사에
          # 올리려는 요청을 막는다.
          git fetch --tags --quiet
          if ! git rev-parse "refs/tags/release/$VERSION" >/dev/null 2>&1; then
            echo "::error::release/$VERSION 태그가 없다. 빌드된 적 없는 버전은 제출할 수 없다."
            exit 1
          fi
          echo "검증 통과: $VERSION / $PLATFORM"

      - name: 패치노트를 distribution/ 에 반영
        id: notes
        env:
          NOTES: ${{ github.event.client_payload.releaseNotes }}
          VERSION: ${{ github.event.client_payload.version }}
          REQUESTER: ${{ github.event.client_payload.requestedBy }}
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NOTES:-}" ]; then
            echo "초안이 없다 — distribution/ 에 있는 내용 그대로 제출한다"
            exit 0
          fi
          # Play 500자 제한. 넘으면 업로드가 거부되므로 커밋하기 전에 막는다.
          LEN=$(printf '%s' "$NOTES" | wc -m | tr -d ' ')
          if [ "$LEN" -gt 500 ]; then
            echo "::error::패치노트가 ${LEN}자로 Play 제한(500자)을 넘는다."
            exit 1
          fi
          printf '%s\n' "$NOTES" > distribution/whatsnew/whatsnew-ko-KR
          cp distribution/whatsnew/whatsnew-ko-KR distribution/metadata/ko/release_notes.txt

          if git diff --quiet -- distribution/; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi

          # main 에 직접 push 하지 않는다. 'main-pr-only' ruleset 이 PR 을 강제하고
          # bypass 주체가 없어서 bot 도 막힌다("Changes must be made through a pull
          # request"). 브랜치를 따서 PR 로 올린다.
          #
          # PR 을 자동 머지하지 않는 이유: 심사는 이미 제출되므로 패치노트 PR 이
          # 늦게 머지돼도 스토어 쪽에는 영향이 없다. 사람이 문구를 한 번 더 보고
          # 머지하는 편이 안전하다.
          BRANCH="docs/release-notes-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add distribution/
          git commit -m "docs: $VERSION 패치노트를 반영한다 (Discord 승인: $REQUESTER)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: $VERSION 패치노트" \
            --body "$(printf 'Discord 에서 **%s** 님이 승인한 패치노트입니다.\n\n심사 제출은 이미 시작됐고, 이 PR 은 레포에 기록을 남기기 위한 것입니다.\n\n```\n%s\n```\n' "$REQUESTER" "$NOTES")"
          echo "패치노트 PR 을 올렸다 — $BRANCH"

  # 실제 제출. 패치노트를 같이 넘긴다 — Play 는 내부테스트 업로드 시점(태그 push)에
  # 노트를 읽으므로 승격 때 다시 올려야 Discord 에서 고친 내용이 반영되고, iOS 는
  # distribution/metadata 를 읽는데 위 잡이 PR 로만 올리고 머지는 안 하기 때문이다.
  #
  # android_rollout 은 넘기지 않는다. 피호출 쪽 기본값 1(100%)을 그대로 쓴다 —
  # Discord 버튼에는 비율을 고를 자리가 없다. 단계적으로 내보내려면 Actions 탭에서
  # submit-for-review.yml 을 직접 실행한다.
  submit:
    needs: prepare
    uses: ./.github/workflows/submit-for-review.yml
    with:
      version: ${{ github.event.client_payload.version }}
      platform: ${{ github.event.client_payload.platform }}
      release_notes: ${{ github.event.client_payload.releaseNotes }}
    secrets:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      DISCORD_PR_WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}

  # 검증·패치노트 단계가 깨졌을 때만 알린다. 제출 잡 자체의 성패는
  # submit-for-review.yml 의 notify 잡이 이미 Discord 로 보낸다.
  notify-prepare-failure:
    needs: prepare
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 실패 알림
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL || secrets.DISCORD_PR_WEBHOOK_URL }}
          VERSION: ${{ github.event.client_payload.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg t "🔴 심사 제출 요청 실패 — $VERSION" --arg d "$RUN_URL" --argjson c 15158332 \
            '{embeds:[{title:$t,description:$d,color:$c}]}' \
            | curl -sf -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- || true
