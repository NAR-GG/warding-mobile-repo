name: Web Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'turbo.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-web-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile

      # 타입 오류는 빌드보다 먼저 잡는다 — 실패 지점이 더 좁다.
      - run: pnpm typecheck

      # `pnpm build` 가 토큰 → 웹 순서를 보장한다(turbo 그래프).
      # 토큰 CSS 가 있어야 globals.css 의 @import 가 풀린다.
      - run: pnpm build
