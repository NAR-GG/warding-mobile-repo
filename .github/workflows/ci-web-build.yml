name: Web Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-web-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      # 토큰 CSS 가 있어야 globals.css 의 @import 가 풀린다.
      - run: pnpm tokens:build
      - run: pnpm --filter warding-web build
